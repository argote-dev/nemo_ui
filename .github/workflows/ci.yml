name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Flutter ${{ matrix.flutter-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flutter-version:
          - 3.47.0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: flutter analyze

      - name: Test deterministic golden baselines
        run: >-
          flutter test
          test/components/nemo_button_test.dart
          test/components/nemo_surface_golden_test.dart
          test/components/nemo_switch_test.dart
          test/components/nemo_page_golden_test.dart

      - name: Upload golden failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-failures-flutter-${{ matrix.flutter-version }}
          path: test/**/failures/**
          if-no-files-found: warn

      - name: Test package with coverage
        run: flutter test --coverage

      - name: Enforce coverage baseline
        run: dart run tool/check_coverage.dart coverage/lcov.info tool/coverage_baseline.json

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Build example for web
        working-directory: example
        run: flutter build web

      - name: Validate package publication
        run: flutter pub publish --dry-run

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-flutter-${{ matrix.flutter-version }}
          path: coverage/lcov.info
          if-no-files-found: warn
