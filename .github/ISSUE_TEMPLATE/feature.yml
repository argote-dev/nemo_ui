name: Component or feature request
description: Propose a new component or reusable capability.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or design-system problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract
      description: Describe API, states, tokens, and composition boundaries.
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility and input modes
      description: Cover semantics, keyboard, focus, text scaling, contrast, and reduced motion.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
