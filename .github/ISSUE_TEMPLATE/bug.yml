name: Bug report
description: Report reproducible incorrect behavior in Nemo UI.
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a repository, test, or compact code sample.
    validations:
      required: true
  - type: input
    id: nemo-version
    attributes:
      label: Nemo UI version or commit
    validations:
      required: true
  - type: input
    id: flutter-version
    attributes:
      label: Flutter version
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Affected platforms
      multiple: true
      options:
        - Android
        - iOS
        - Web
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and visual evidence
